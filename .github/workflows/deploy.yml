name: Build and publish academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-pages-production
  cancel-in-progress: false

env:
  WC_HUGO_VERSION: '0.148.2'
  NODE_VERSION: '24'
  SITE_URL: https://dylanchiang-dev.github.io/

jobs:
  publish:
    if: github.repository == 'dylanchiang-lab/P-academic'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true

      - name: Cache Hugo modules and processed resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/hugo-cache
            resources/
          key: ${{ runner.os }}-academic-hugo-${{ env.WC_HUGO_VERSION }}-${{ hashFiles('go.mod', 'go.sum', 'pnpm-lock.yaml', 'assets/**', 'config/**') }}
          restore-keys: |
            ${{ runner.os }}-academic-hugo-${{ env.WC_HUGO_VERSION }}-

      - name: Build the original site URL
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
        run: |
          hugo --minify --cleanDestinationDir --baseURL "$SITE_URL"
          test -s public/index.html
          test -s public/en/index.html
          touch public/.nojekyll

      - name: Publish generated files to the personal Pages repository
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.ACADEMIC_PAGES_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-pages.sh
